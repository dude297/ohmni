name: postdeploy
# After a push to main, wait for Vercel production to serve this commit, then run cheap non-model checks. No secrets.
on:
  push:
    branches: [main]
concurrency: { group: postdeploy, cancel-in-progress: true }
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: node scripts/postdeploy-smoke.mjs https://multimodal-hackathon-sage.vercel.app ${{ github.sha }}
